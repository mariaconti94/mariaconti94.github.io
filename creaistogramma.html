<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore di Istogrammi Professionale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .canvas-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        input:focus, textarea:focus {
            outline: 2px solid #3b82f6;
            outline-offset: -1px;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-800">Simulatore di Istogramma HTML5</h1>
            <p class="text-slate-600">Inserisci i dati e sovrapponi parametri statistici manuali</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Pannello di Controllo -->
            <div class="lg:col-span-1 space-y-6 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Dati (separati da virgola o spazio)</label>
                    <textarea id="dataInput" class="w-full h-32 p-3 border border-slate-300 rounded-md text-sm" placeholder="Es: 10, 12, 23, 23, 45, 12, 34, 48, 50, 55, 60..."></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Limite Inf. X</label>
                        <input type="number" id="minX" class="w-full p-2 border border-slate-300 rounded-md" value="0">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Limite Sup. X</label>
                        <input type="number" id="maxX" class="w-full p-2 border border-slate-300 rounded-md" value="100">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Ampiezza Bin</label>
                    <input type="number" id="binWidth" class="w-full p-2 border border-slate-300 rounded-md" value="10" min="0.1" step="0.1">
                </div>

                <hr class="border-slate-100">
                
                <div class="bg-blue-50 p-4 rounded-lg space-y-3 border border-blue-100">
                    <p class="text-xs font-bold text-blue-800 uppercase tracking-wider">Parametri Manuali (Overlay)</p>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-blue-700 mb-1">Media (μ)</label>
                            <input type="number" id="manualMean" class="w-full p-2 border border-blue-200 rounded-md" placeholder="Es: 50">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-blue-700 mb-1">Dev. Standard (σ)</label>
                            <input type="number" id="manualStd" class="w-full p-2 border border-blue-200 rounded-md" placeholder="Es: 5">
                        </div>
                    </div>
                </div>

                <hr class="border-slate-100">

                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Titolo Grafico</label>
                        <input type="text" id="chartTitle" class="w-full p-2 border border-slate-300 rounded-md" value="Distribuzione Frequenze">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Etichetta Asse X</label>
                        <input type="text" id="labelX" class="w-full p-2 border border-slate-300 rounded-md" value="Valori Misurati">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Etichetta Asse Y</label>
                        <input type="text" id="labelY" class="w-full p-2 border border-slate-300 rounded-md" value="Frequenza Assoluta">
                    </div>
                </div>

                <button id="downloadBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Scarica PNG
                </button>
            </div>

            <!-- Area Visualizzazione -->
            <div class="lg:col-span-2 flex flex-col gap-4">
                <div class="canvas-container p-4 flex items-center justify-center min-h-[500px]">
                    <canvas id="histogramCanvas" width="800" height="500" class="max-w-full h-auto"></canvas>
                </div>
                <div id="statsInfo" class="bg-slate-50 border border-slate-100 p-4 rounded-lg text-slate-600 text-sm">
                    Inserisci dei numeri per vedere l'analisi statistica.
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('histogramCanvas');
        const ctx = canvas.getContext('2d');
        
        // Lista ID di tutti gli input per il refresh automatico
        const inputIds = [
            'dataInput', 'minX', 'maxX', 'binWidth', 
            'manualMean', 'manualStd', 
            'chartTitle', 'labelX', 'labelY'
        ];

        inputIds.forEach(id => {
            document.getElementById(id).addEventListener('input', updateChart);
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'istogramma_personalizzato.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        function updateChart() {
            const dataStr = document.getElementById('dataInput').value;
            const minX = parseFloat(document.getElementById('minX').value) || 0;
            const maxX = parseFloat(document.getElementById('maxX').value) || 100;
            const binWidth = parseFloat(document.getElementById('binWidth').value) || 1;
            const title = document.getElementById('chartTitle').value;
            const labelX = document.getElementById('labelX').value;
            const labelY = document.getElementById('labelY').value;

            // Parametri Manuali
            const manualMean = document.getElementById('manualMean').value !== "" ? parseFloat(document.getElementById('manualMean').value) : null;
            const manualStd = document.getElementById('manualStd').value !== "" ? parseFloat(document.getElementById('manualStd').value) : null;

            // Parsing dati
            const data = dataStr.split(/[,\s]+/)
                .map(v => parseFloat(v))
                .filter(v => !isNaN(v));

            if (data.length === 0) {
                drawPlaceholder();
                document.getElementById('statsInfo').innerText = "In attesa di dati validi...";
                return;
            }

            // Calcolo bin
            const bins = [];
            const numBins = Math.max(1, Math.ceil((maxX - minX) / binWidth));
            for (let i = 0; i < numBins; i++) {
                bins.push({
                    start: minX + (i * binWidth),
                    end: minX + ((i + 1) * binWidth),
                    count: 0
                });
            }

            data.forEach(val => {
                const binIndex = Math.floor((val - minX) / binWidth);
                if (binIndex >= 0 && binIndex < bins.length) {
                    bins[binIndex].count++;
                }
            });

            const maxCount = Math.max(...bins.map(b => b.count), 1);
            
            // Info Statistiche automatiche (solo per riferimento nel box informativo)
            const autoMean = (data.reduce((a,b)=>a+b,0)/data.length).toFixed(2);
            document.getElementById('statsInfo').innerHTML = `
                <strong>Dati:</strong> Campioni: ${data.length}  | 
                <strong>Overlay Manuale:</strong> Media inserita: ${manualMean !== null ? manualMean : 'N/D'} | Dev. Std inserita: ${manualStd !== null ? manualStd : 'N/D'}
            `;

            draw(bins, maxCount, minX, maxX, title, labelX, labelY, manualMean, manualStd);
        }

        function draw(bins, maxCount, minX, maxX, title, labelX, labelY, manualMean, manualStd) {
            const width = canvas.width;
            const height = canvas.height;
            const padding = 60;
            const chartTop = 80;
            const chartBottom = height - padding;
            const chartLeft = padding + 20;
            const chartRight = width - padding;
            const chartWidth = chartRight - chartLeft;
            const chartHeight = chartBottom - chartTop;

            // Pulizia
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, width, height);

            // Titolo
            ctx.fillStyle = "#1e293b";
            ctx.font = "bold 24px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(title, width / 2, 40);

            // Assi
            ctx.strokeStyle = "#94a3b8";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(chartLeft, chartTop);
            ctx.lineTo(chartLeft, chartBottom);
            ctx.lineTo(chartRight, chartBottom);
            ctx.stroke();

            // Etichette Assi
            ctx.font = "14px sans-serif";
            ctx.fillStyle = "#475569";
            ctx.fillText(labelX, width / 2, height - 15);
            
            ctx.save();
            ctx.translate(20, height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText(labelY, 0, 0);
            ctx.restore();

            // Disegno Barre
            const barWidth = chartWidth / bins.length;
            
            bins.forEach((bin, i) => {
                const barHeight = (bin.count / maxCount) * chartHeight;
                const x = chartLeft + (i * barWidth);
                const y = chartBottom - barHeight;

                ctx.fillStyle = "rgba(59, 130, 246, 0.7)";
                ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
                ctx.lineWidth = 1;
                ctx.fillRect(x, y, barWidth, barHeight);
                ctx.strokeRect(x, y, barWidth, barHeight);

                // Etichette X (ogni n bin per leggibilità)
                const skip = Math.ceil(bins.length / 10);
                if (i % skip === 0) {
                    ctx.fillStyle = "#64748b";
                    ctx.font = "10px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(bin.start.toFixed(1), x + (barWidth/2), chartBottom + 15);
                }
            });

            // Scala asse Y
            ctx.textAlign = "right";
            for (let i = 0; i <= 5; i++) {
                const val = (maxCount / 5) * i;
                const y = chartBottom - (i * chartHeight / 5);
                ctx.fillText(Math.round(val), chartLeft - 10, y + 5);
                
                ctx.beginPath();
                ctx.strokeStyle = "#f1f5f9";
                ctx.moveTo(chartLeft, y);
                ctx.lineTo(chartRight, y);
                ctx.stroke();
            }

            // FUNZIONE PER MAPPARE VALORI X COORDINATE CANVAS
            const getXCoord = (val) => {
                const ratio = (val - minX) / (maxX - minX);
                return chartLeft + (ratio * chartWidth);
            };

            // DISEGNO MEDIA MANUALE
            if (manualMean !== null && manualMean >= minX && manualMean <= maxX) {
                const meanX = getXCoord(manualMean);
                
                // Linea Media
                ctx.setLineDash([5, 5]);
                ctx.strokeStyle = "#ef4444";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(meanX, chartTop);
                ctx.lineTo(meanX, chartBottom);
                ctx.stroke();
                ctx.setLineDash([]); // Reset

                // Etichetta Media
                ctx.fillStyle = "#ef4444";
                ctx.textAlign = "center";
                ctx.font = "bold 12px sans-serif";
                ctx.fillText(`Media (μ): ${manualMean}`, meanX, chartTop - 10);

                // DISEGNO DEVIAZIONE STANDARD MANUALE
                if (manualStd !== null && manualStd > 0) {
                    const leftStdX = getXCoord(manualMean - manualStd);
                    const rightStdX = getXCoord(manualMean + manualStd);

                    // Area Sigma
                    ctx.fillStyle = "rgba(239, 68, 68, 0.1)";
                    const drawLeft = Math.max(chartLeft, leftStdX);
                    const drawRight = Math.min(chartRight, rightStdX);
                    ctx.fillRect(drawLeft, chartTop, drawRight - drawLeft, chartHeight);

                    // Bordi Sigma
                    ctx.strokeStyle = "rgba(239, 68, 68, 0.5)";
                    ctx.lineWidth = 1;
                    if (leftStdX >= chartLeft && leftStdX <= chartRight) {
                        ctx.beginPath();
                        ctx.moveTo(leftStdX, chartTop);
                        ctx.lineTo(leftStdX, chartBottom);
                        ctx.stroke();
                    }
                    if (rightStdX >= chartLeft && rightStdX <= chartRight) {
                        ctx.beginPath();
                        ctx.moveTo(rightStdX, chartTop);
                        ctx.lineTo(rightStdX, chartBottom);
                        ctx.stroke();
                    }
                }
            }
        }

        function drawPlaceholder() {
            const width = canvas.width;
            const height = canvas.height;
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "#f8fafc";
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = "#94a3b8";
            ctx.textAlign = "center";
            ctx.font = "20px sans-serif";
            ctx.fillText("Inserisci dei dati per visualizzare l'istogramma", width/2, height/2);
        }

        window.onload = drawPlaceholder;
    </script>
</body>
</html>
